<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pack Check</title>
<meta name="description" content="Pack Check: list everything you bring to a sleepover or trip, then tick it off when you pack to go home, so nothing gets left behind.">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// apply the saved Light/Dark choice before the page draws
try {
  var pcT = localStorage.getItem("packcheck_theme");
  if (pcT === "dark" || pcT === "light") document.documentElement.setAttribute("data-theme", pcT);
  else if (window.PackAndroid && PackAndroid.systemDark && PackAndroid.systemDark()) document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<style>
/* Same look as Schedule Maker and Luv Launcher: cream, terracotta, serif headings */
:root{color-scheme:light dark;--bg:#F4F3EE;--card:#FFFFFF;--line:#E4E1D8;--text:#1F1E1D;--mute:#6F6D66;--acc:#C15F3C;--soft:#EBE9E1;--tint:#F7EBE5;--green:#5E8466;--shadow:0 1px 2px rgba(31,30,29,.05),0 6px 20px rgba(31,30,29,.06)}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161615;--card:#20201E;--line:#33332F;--text:#F0EFEA;--mute:#9C9A94;--acc:#D97757;--soft:#2C2C2A;--tint:#33251F;--green:#8DB596;--shadow:0 6px 20px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201E;--line:#33332F;--text:#F0EFEA;--mute:#9C9A94;--acc:#D97757;--soft:#2C2C2A;--tint:#33251F;--green:#8DB596;--shadow:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--text)}
a{color:inherit}
.serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif;font-weight:400}
.wrap{max-width:560px;margin:auto;padding:0 18px calc(48px + env(safe-area-inset-bottom,0px))}
.ic{width:18px;height:18px;flex-shrink:0;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.i-plus{--i:url(icons/plus.png)}.i-x{--i:url(icons/x.png)}.i-trash{--i:url(icons/trash.png)}.i-bag{--i:url(icons/backpack.png)}.i-check{--i:url(icons/check.png)}

header{padding:calc(28px + env(safe-area-inset-top,0px)) 0 14px;display:flex;align-items:flex-start;gap:12px}
header .t{flex:1;min-width:0}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{font-size:34px;letter-spacing:-.6px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.sum{color:var(--mute);margin-top:6px;font-size:15px;text-wrap:pretty}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-shrink:0}
.seg button{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .sun,.seg .moon{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.seg .sun{background:currentColor;box-shadow:0 0 0 2.5px color-mix(in srgb,currentColor 25%,transparent)}
.seg .moon{width:12px;height:12px;box-shadow:inset 4px -3px 0 0 currentColor;transform:rotate(-20deg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 2px 10px}
.inrow{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:6px 6px 6px 14px}
.inrow input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:8px 0}
.inrow input::placeholder{color:var(--mute)}
.send{width:40px;height:40px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;flex-shrink:0}
.send:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--mute);background:transparent;transition:background .15s,color .15s}
.chip:hover{background:var(--soft);color:var(--text)}
.chip .ic{width:11px;height:11px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:500;transition:transform .12s,background .15s;text-decoration:none;color:inherit}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:#B84A3A}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btns .btn{flex:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* lists on the home page */
.list{display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:inherit}
.list .ico{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--acc);display:grid;place-items:center;flex-shrink:0}
.list .ico .ic{width:22px;height:22px}
.list .ico.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.list .nm{font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.list .sub{font-size:13px;color:var(--mute);margin-top:2px}
.list .mid{flex:1;min-width:0}
.list .nm,.list .sub,.list .track{display:block}
.track{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:8px}
.track div{height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.track.done div{background:var(--green)}
.empty{color:var(--mute);font-size:15px;text-align:center;padding:26px 10px}
.empty .ic{width:36px;height:36px;margin:0 auto 10px;opacity:.5}

/* one list */
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);text-decoration:none;padding:6px 10px 6px 0;margin-top:calc(18px + env(safe-area-inset-top,0px))}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.back:hover{color:var(--text)}
.prog{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog b{font-size:28px;font-weight:400;font-family:ui-serif,Georgia,Cambria,serif;font-variant-numeric:tabular-nums}
.prog span{font-size:14px;color:var(--mute)}
.allset{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--green);font-weight:500}
.allset .ic{width:20px;height:20px}
.item{display:flex;align-items:center;gap:12px;padding:6px 4px 6px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{flex:1;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 0;min-width:0}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .15s,border-color .15s}
.box .ic{width:13px;height:13px;color:#fff;opacity:0}
.item.on .box{background:var(--green);border-color:var(--green)}
.item.on .box .ic{opacity:1}
.item .txt{font-size:16px;overflow-wrap:anywhere}
.item.on .txt{color:var(--mute);text-decoration:line-through}
.del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute);flex-shrink:0}
.del:hover{background:var(--soft);color:var(--text)}
.del .ic{width:12px;height:12px}
.hint{font-size:13px;color:var(--mute);text-align:center;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--acc);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const KEY = "packcheck_v1";

// things people often bring, picked by words in the list's name
const SUGGEST = {
  base: ["Phone charger", "Toothbrush", "Toothpaste", "Clothes for tomorrow", "Pajamas", "Socks", "Underwear", "Headphones", "Water bottle", "Hairbrush"],
  sleep: ["Pajamas", "Toothbrush", "Phone charger", "Clothes for tomorrow", "Pillow", "Sleeping bag", "Snacks", "Games"],
  trip: ["Jacket", "Snacks", "Sunscreen", "Hat", "Money", "Power bank"],
  beach: ["Swimsuit", "Towel", "Sunscreen", "Flip-flops", "Sunglasses"],
  sport: ["Sports shoes", "Shin pads", "Towel", "Spare shirt", "Deodorant"],
  school: ["Books", "Pencil case", "Lunch", "Notebook", "Laptop"]
};
const STARTERS = ["Sleepover", "School trip", "Holiday", "Sports practice", "Beach day"];

// ---------- saved data ----------
let data = { lists: [] };
try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && Array.isArray(d.lists)) data = d; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = id => data.lists.find(l => l.id === id);
const packed = l => l.items.filter(i => i.packed).length;

function suggestionsFor(l) {
  const n = l.name.toLowerCase();
  let out = SUGGEST.base.slice();
  if (/sleep|friend|over/.test(n)) out = SUGGEST.sleep.concat(out);
  if (/trip|holiday|vacation|camp|travel|hotel/.test(n)) out = SUGGEST.trip.concat(out);
  if (/beach|pool|swim|sea/.test(n)) out = SUGGEST.beach.concat(out);
  if (/sport|football|soccer|basketball|gym|practice|game|match/.test(n)) out = SUGGEST.sport.concat(out);
  if (/school|class|lesson/.test(n)) out = SUGGEST.school.concat(out);
  const have = new Set(l.items.map(i => i.text.toLowerCase()));
  return [...new Set(out)].filter(s => !have.has(s.toLowerCase())).slice(0, 10);
}

// ---------- pages ----------
function themeSeg() {
  return `<div class="seg" role="group" aria-label="Colour theme"><button data-theme-set="light"><i class="sun"></i>Light</button><button data-theme-set="dark"><i class="moon"></i>Dark</button></div>`;
}
function home() {
  const lists = data.lists.slice().sort((a, b) => b.created - a.created);
  return `<header><div class="t"><div class="kicker">Pack Check</div><h1 class="serif">Your lists</h1>
      <p class="sum">Write down what you bring. Tick it off when you pack to go home, so nothing gets left behind.</p></div>${themeSeg()}</header>
    <div class="card">
      <form class="inrow" id="newForm"><input id="newName" placeholder="Where are you going?" autocomplete="off" enterkeyhint="go" maxlength="60" aria-label="List name">
        <button class="send" aria-label="Make the list"><i class="ic i-plus"></i></button></form>
      <div class="chips">${STARTERS.map(s => `<button class="chip" data-start="${esc(s)}"><i class="ic i-plus"></i>${esc(s)}</button>`).join("")}</div>
    </div>
    <div class="label"><span>Lists</span><span>${lists.length}</span></div>
    ${lists.length ? lists.map(l => {
      const p = packed(l), n = l.items.length, done = n > 0 && p === n;
      return `<div class="card"><a class="list" href="#list/${l.id}">
        <span class="ico${done ? " done" : ""}"><i class="ic ${done ? "i-check" : "i-bag"}"></i></span>
        <span class="mid"><span class="nm serif">${esc(l.name)}</span>
          <span class="sub">${n === 0 ? "Nothing added yet" : done ? `All ${n} packed` : `${p} of ${n} packed`}</span>
          ${n ? `<span class="track${done ? " done" : ""}"><div style="width:${Math.round(p / n * 100)}%"></div></span>` : ""}</span></a></div>`;
    }).join("") : `<div class="card empty"><i class="ic i-bag"></i>No lists yet. Make one above, like "Sleepover".</div>`}`;
}
function listPage(l) {
  const p = packed(l), n = l.items.length, done = n > 0 && p === n;
  const left = l.items.filter(i => !i.packed), got = l.items.filter(i => i.packed);
  const row = i => `<div class="item${i.packed ? " on" : ""}">
      <button class="tick" data-tick="${i.id}" aria-pressed="${i.packed}"><span class="box"><i class="ic i-check"></i></span><span class="txt">${esc(i.text)}</span></button>
      <button class="del" data-del="${i.id}" aria-label="Remove ${esc(i.text)}"><i class="ic i-x"></i></button></div>`;
  // an empty list starts with the add box; a full one shows what's left first and the add box below
  const sugg = suggestionsFor(l).slice(0, n ? 6 : 10);
  const addBox = `<div class="card">
      <form class="inrow" id="addForm"><input id="addText" placeholder="Add something you're bringing" autocomplete="off" enterkeyhint="done" maxlength="80" aria-label="New thing">
        <button class="send" aria-label="Add it"><i class="ic i-plus"></i></button></form>
      ${sugg.length ? `<div class="chips">${sugg.map(s => `<button class="chip" data-add="${esc(s)}"><i class="ic i-plus"></i>${esc(s)}</button>`).join("")}</div>` : ""}
    </div>`;
  return `<a class="back" href="#">Your lists</a>
    <header><div class="t"><div class="kicker">${n} thing${n === 1 ? "" : "s"} to bring back</div><h1 class="serif">${esc(l.name)}</h1></div>${themeSeg()}</header>
    ${n ? `<div class="card"><div class="prog"><b>${p} of ${n}</b><span>${done ? "packed" : `packed · ${n - p} left`}</span></div>
      <div class="track${done ? " done" : ""}"><div style="width:${Math.round(p / n * 100)}%"></div></div>
      ${done ? `<div class="allset"><i class="ic i-check"></i>All packed. Nothing forgotten!</div>` : `<p class="hint" style="text-align:left;margin-top:10px">Tap a thing when it's back in your bag.</p>`}</div>` : addBox}
    ${left.length ? `<div class="label"><span>Still to pack</span><span>${left.length}</span></div><div class="card">${left.map(row).join("")}</div>` : ""}
    ${got.length ? `<div class="label"><span>Packed</span><span>${got.length}</span></div><div class="card">${got.map(row).join("")}</div>` : ""}
    ${n ? `<div class="label"><span>Add more</span></div>` + addBox : `<div class="card empty"><i class="ic i-bag"></i>Add what you're bringing, or tap the ideas above.</div>`}
    <div class="btns">
      ${p ? `<button class="btn" id="again">Use again</button>` : ""}
      <button class="btn bad" id="delList"><i class="ic i-trash"></i>Delete list</button>
    </div>`;
}

let shown = "";
function render() {
  const r = (location.hash || "#").slice(1);
  const l = r.startsWith("list/") ? byId(r.slice(5)) : null;
  const app = document.getElementById("app");
  const keep = document.activeElement && document.activeElement.id === "addText" && shown === r;
  app.innerHTML = l ? listPage(l) : home();
  document.title = l ? l.name + " · Pack Check" : "Pack Check";
  if (keep) document.getElementById("addText").focus();
  if (shown !== r) window.scrollTo(0, 0);
  shown = r;
  paintTheme();
}

// ---------- actions ----------
function makeList(name) {
  name = name.trim();
  if (!name) return;
  const l = { id: uid(), name: name, created: Date.now(), items: [] };
  data.lists.push(l); save();
  location.hash = "#list/" + l.id;
}
function current() { const r = (location.hash || "").slice(1); return r.startsWith("list/") ? byId(r.slice(5)) : null; }
function addItem(text) {
  const l = current(); text = text.trim();
  if (!l || !text) return;
  if (l.items.some(i => i.text.toLowerCase() === text.toLowerCase())) { toast(`"${text}" is already on the list`); return; }
  l.items.push({ id: uid(), text: text, packed: false }); save(); render();
}

let toastT, undoFn = null;
function toast(msg, undo) {
  const t = document.getElementById("toast");
  undoFn = undo || null;
  t.innerHTML = esc(msg) + (undo ? ` <button id="undo">Undo</button>` : "");
  t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove("show"); undoFn = null; }, undo ? 5000 : 2600);
}

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "newForm") makeList(document.getElementById("newName").value);
  if (e.target.id === "addForm") { const inp = document.getElementById("addText"); const v = inp.value; inp.value = ""; addItem(v); }
});
document.addEventListener("click", e => {
  const t = e.target;
  const th = t.closest("[data-theme-set]"); if (th) { setTheme(th.dataset.themeSet); return; }
  if (t.closest("#undo")) { if (undoFn) undoFn(); undoFn = null; document.getElementById("toast").classList.remove("show"); return; }
  const st = t.closest("[data-start]"); if (st) { makeList(st.dataset.start); return; }
  const ad = t.closest("[data-add]"); if (ad) { addItem(ad.dataset.add); return; }
  const l = current(); if (!l) return;
  const tk = t.closest("[data-tick]");
  if (tk) {
    const it = l.items.find(i => i.id === tk.dataset.tick);
    if (it) { it.packed = !it.packed; save(); render(); if (it.packed && packed(l) === l.items.length) toast("All packed. Nothing forgotten!"); }
    return;
  }
  const dl = t.closest("[data-del]");
  if (dl) {
    const idx = l.items.findIndex(i => i.id === dl.dataset.del);
    if (idx < 0) return;
    const [gone] = l.items.splice(idx, 1); save(); render();
    toast(`Removed "${gone.text}"`, () => { l.items.splice(idx, 0, gone); save(); render(); });
    return;
  }
  if (t.closest("#again")) {
    const before = l.items.map(i => i.packed);
    l.items.forEach(i => { i.packed = false; }); save(); render();
    toast("Ticks cleared. Ready for next time.", () => { l.items.forEach((i, k) => { i.packed = before[k]; }); save(); render(); });
    return;
  }
  if (t.closest("#delList")) {
    const idx = data.lists.indexOf(l);
    data.lists.splice(idx, 1); save();
    location.hash = "#";
    toast(`Deleted "${l.name}"`, () => { data.lists.splice(idx, 0, l); save(); location.hash = "#list/" + l.id; });
  }
});

// ---------- Light / Dark ----------
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function theme() { return document.documentElement.getAttribute("data-theme") || (darkQuery.matches ? "dark" : "light"); }
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("packcheck_theme", t); } catch (e) {}
  paintTheme();
}
function paintTheme() {
  const t = theme();
  document.querySelectorAll("[data-theme-set]").forEach(b => { b.classList.toggle("on", b.dataset.themeSet === t); b.setAttribute("aria-pressed", b.dataset.themeSet === t); });
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", t === "dark" ? "#161615" : "#F4F3EE"));
  if (window.PackAndroid && window.PackAndroid.setTheme) { try { window.PackAndroid.setTheme(t); } catch (e) {} }
}
darkQuery.addEventListener("change", paintTheme);

window.addEventListener("hashchange", render);
window.addEventListener("storage", e => { if (e.key === KEY) { try { data = JSON.parse(e.newValue) || data; } catch (x) {} render(); } });
render();
</script>
</body>
</html>
